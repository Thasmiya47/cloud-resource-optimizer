<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Cloud Optimizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { width: 440px; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; padding: 35px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .brand-logo { width: 38px; height: 38px; background: #2563eb; color: #fff; border-radius: 8px; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="d-flex align-items-center gap-2 mb-3">
      <div class="brand-logo">C</div>
      <h5 class="fw-bold mb-0">Cloud Optimizer</h5>
    </div>
    <h6 class="fw-bold mb-1">Create company workspace</h6>
    <p class="text-muted small mb-3">Begin monitoring your multi-cloud infrastructure</p>
    
    <form method="POST" action="/signup">
      <div class="mb-2">
        <label class="form-label small fw-semibold">Your Full Name</label>
        <input type="text" name="full_name" class="form-control" placeholder="Ria Anand" required>
      </div>
      <div class="mb-2">
        <label class="form-label small fw-semibold">Company Name</label>
        <input type="text" name="company_name" class="form-control" placeholder="Acme Technologies" required>
      </div>
      <div class="mb-2">
        <label class="form-label small fw-semibold">Work Email</label>
        <input type="email" name="email" class="form-control" placeholder="admin@acme.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Create strong password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Register & Continue</button>
    </form>
    
    <div class="text-center mt-3">
      <small class="text-muted">Already registered? <a href="/login" class="text-decoration-none fw-semibold">Sign In</a></small>
    </div>
  </div>
</body>
</html>
