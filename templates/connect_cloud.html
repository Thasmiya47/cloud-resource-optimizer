<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Connect Cloud Account - Cloud Optimizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card-box { width: 500px; border-radius: 12px; background: #fff; padding: 35px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="card-box">
    <h5 class="fw-bold mb-1">Connect Your Cloud Platform</h5>
    <p class="text-muted small mb-4">Provide read-only API access credentials for telemetry discovery.</p>
    
    <form method="POST" action="/connect-cloud">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Cloud Provider</label>
        <select class="form-select" name="provider">
          <option value="AWS">Amazon Web Services (AWS)</option>
          <option value="Azure">Microsoft Azure</option>
          <option value="Google Cloud">Google Cloud Platform (GCP)</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Access Key ID / Tenant Subscription ID</label>
        <input type="text" name="account_id" class="form-control" placeholder="e.g. AKIAIOSFODNN7EXAMPLE" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Secret Access Key / Client Secret</label>
        <input type="password" name="secret_key" class="form-control" placeholder="wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY" required>
        <div class="form-text small">Stored securely following least-privilege read-only policy.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Authenticate & Launch Dashboard</button>
    </form>
  </div>
</body>
</html>
