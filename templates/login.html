<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Cloud Optimizer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #f4f6fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .auth-card { width: 420px; border-radius: 12px; border: 1px solid #e2e8f0; background: #fff; padding: 35px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .brand-logo { width: 38px; height: 38px; background: #2563eb; color: #fff; border-radius: 8px; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="d-flex align-items-center gap-2 mb-4">
      <div class="brand-logo">C</div>
      <h5 class="fw-bold mb-0">Cloud Optimizer</h5>
    </div>
    <h6 class="fw-bold mb-1">Sign in to your account</h6>
    <p class="text-muted small mb-4">Enter your corporate credentials below</p>
    
    <form method="POST" action="/login">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Corporate Email</label>
        <input type="email" name="email" class="form-control" placeholder="name@company.com" required>
      </div>
      <div class="mb-3">
        <label class="form-label small fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
    </form>
    
    <div class="text-center mt-4">
      <small class="text-muted">Don't have an account? <a href="/signup" class="text-decoration-none fw-semibold">Create company account</a></small>
    </div>
  </div>
</body>
</html>
